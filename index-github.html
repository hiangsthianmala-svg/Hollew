.a.mt{display:none}
.pg.live+.a:has(>.dots){display:none}
.pg{border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;padding:6px 2px;margin:0;border-radius:0}
.pg .pd{flex:none;display:inline-flex;gap:3px}
.pg .pd i{width:5px;height:5px;border-radius:50%;background:var(--g2);opacity:.3;animation:pdb 1.2s infinite}
.pg .pd i:nth-child(2){animation-delay:.2s}.pg .pd i:nth-child(3){animation-delay:.4s}
@keyframes pdb{0%,100%{opacity:.3}50%{opacity:1}}
.pg svg{color:var(--muted)}
.pg.live .pt{animation:none;background:none;color:var(--muted);-webkit-background-clip:border-box;background-clip:border-box}
@media (prefers-reduced-motion:reduce){.pg .pd i{animation:none;opacity:.7}}
#rsheet{height:auto;max-height:72vh;min-height:36vh}
#rsheet .rh{margin-bottom:12px}
.rd i{width:10px;height:10px;background:var(--border)}
.rd i.lv{background:var(--g2);animation:none;box-shadow:none}
.rs{padding:7px 0;gap:12px}
.rs:not(:last-child)::after{width:1px;top:30px;bottom:-7px}
.rt{font-size:16px;line-height:1.4;padding-top:0}
.rt.now{color:var(--muted)}
.cb{margin:8px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden}.cb pre{margin:0;border:0;border-radius:0}.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;font-size:12px;color:var(--muted);background:var(--surface)}.cc{border:0;background:none;color:inherit;font:inherit;padding:4px 8px;border-radius:8px;cursor:pointer}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(60px);opacity:.55}
body::before{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,var(--glow2),transparent 65%);animation:aur1 18s ease-in-out infinite alternate}
body::after{width:60vmax;height:60vmax;right:-22vmax;bottom:-18vmax;background:radial-gradient(circle,var(--glow1),transparent 65%);animation:aur2 22s ease-in-out infinite alternate}
@keyframes aur1{to{transform:translate(12vmax,10vmax) scale(1.15)}}@keyframes aur2{to{transform:translate(-10vmax,-12vmax) scale(1.2)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
.i{stroke-width:2}
form .ib{width:40px;height:40px;border:1px solid var(--border);background:var(--surface);color:var(--g1);box-shadow:0 2px 8px rgba(95,26,209,.14);transition:transform .15s,background .2s}
form .ib:active{transform:scale(.9)}
#spb,#wave{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
#mic.on,#wave.on{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;animation:micp 1.3s ease-out infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(145,38,249,.55)}100%{box-shadow:0 0 0 14px rgba(145,38,249,0)}}
.ac button{width:36px;height:36px;border-radius:50%;border:0;display:inline-grid;place-items:center;background:rgba(145,38,249,.12);color:var(--g1);margin-right:6px}
.ac button:active{transform:scale(.9)}
header .ib{background:var(--surface);color:var(--g1);box-shadow:0 2px 8px rgba(95,26,209,.14)}

.ac>button{background:none!important;color:var(--text)!important;width:34px;height:34px;opacity:.8;margin-right:4px}
.ac svg{stroke-width:1.5}
form .ib{background:color-mix(in srgb,var(--text) 8%,transparent)!important;border:0!important;box-shadow:none!important;color:var(--text)!important}
#wave{background:var(--text)!important;color:var(--bg1)!important}
#mic.on{background:linear-gradient(135deg,var(--g1),var(--g2))!important;color:#fff!important}
.src{margin-top:10px;font-size:13px}.src summary{cursor:pointer;color:var(--muted);display:inline-block;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--text) 7%,transparent)}
.src a{display:block;margin:6px 0 0 4px;color:var(--g1);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fc{display:flex!important;align-items:center;gap:12px;width:100%;padding:12px 14px!important;border:0!important;border-radius:16px!important;background:linear-gradient(135deg,var(--g1),var(--g2))!important;color:#fff!important;text-align:left;box-shadow:0 6px 18px rgba(106,34,232,.35)}
.fc .fi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;color:#fff}
.fc .ft{flex:1;min-width:0;display:flex;flex-direction:column}.fc .ft b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fc .ft small{opacity:.8;font-size:12px}
.fc .fdl{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#050308;--bg2:#160a2b;--glass:rgba(20,12,36,.74);--surface:#1c1330;--text:#f7f2ff;--muted:#ab9bcb;--g1:#6a22e8;--g2:#9126f9;--t1:#b98cff;--t2:#ffffff;--glow1:rgba(145,38,249,.34);--glow2:rgba(145,38,249,.20);--border:rgba(190,150,255,.18);--shadow:0 4px 18px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg1:#050308;--bg2:#160a2b;--glass:rgba(20,12,36,.74);--surface:#1c1330;--text:#f7f2ff;--muted:#ab9bcb;--g1:#6a22e8;--g2:#9126f9;--t1:#b98cff;--t2:#ffffff;--glow1:rgba(145,38,249,.34);--glow2:rgba(145,38,249,.20);--border:rgba(190,150,255,.18);--shadow:0 4px 18px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
header b{flex:1;font-size:17px}
.ib{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;flex:none;font-size:16px;padding:0;display:grid;place-items:center}
#model{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:6px;font:inherit;font-size:13px;max-width:104px}
.mw{position:relative}
#menu{position:absolute;right:0;top:44px;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:180px}
#menu[hidden]{display:none}
#menu button{background:none;border:0;text-align:left;padding:10px;font-size:14px;border-radius:10px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19;display:none}
#scrim.o{display:block}
#side{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--surface);transform:translateX(-100%);transition:transform .25s;z-index:20;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px}
#side.o{transform:none}
#side h2{margin:0;font-size:22px}
#side small{color:var(--muted);margin-top:6px}
#nc{background:#1f1d24;color:#fff;border:0;border-radius:24px;padding:12px;font-weight:600}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:12px}
.it.on{background:var(--bg1)}
.it button{background:none;border:0;padding:10px;text-align:left;font-size:15px}
.it button:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:84%;padding:11px 15px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow);animation:in .25s ease}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:20px 20px 6px 20px}
.a{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 20px 6px}
.w{width:94%;max-width:94%}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--g2);animation:b 1.2s infinite}
